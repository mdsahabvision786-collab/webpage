<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: rgb(99, 45, 14);
            padding: 8px 50px;
            display: flex;
            justify-content: space-between;      
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color:white;
        }
        .logo img{
            width: 35px;
            height: 35px;
            float: left;
        }
        nav ul {
            display: flex;
            list-style: none;
        
        }
        nav ul li {
            margin-left: 30px;
        }
        nav ul li a {
            text-decoration: none;
            color:rgb(255, 255, 255);
            font-weight: 500;
        
        }
        .hero {
            background-color: rgb(86, 41, 8);
            padding: 100px 50px;
            text-align: left;
            color: white;
        }
        .hero h1 {
            font-size: 30px;
            margin-bottom: 30px;
            font-family:cursive;
        }
        .btn {
            display: inline-block;
            background-color: #8B4513;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 20px;
        }
        img {
             float: right;
        }
        a:hover{
            background-color: rgb(81, 81, 12);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="coffee.png"> COFFEE</div>
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">MENU</a></li>
                <li><a href="#">TESTIMANIALS</a></li>
                <li><a href="#">GALLRY</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero">
        <h1><img src="coffee.png" alt="Coffee" style="width:300px;height:270px;"></h1>
        <h1 >Best Coffee</h1>
        <p><strong>Make your day great with our special coffee!</strong></p>
        <p>Welcome to our coffee paradise where every bean tells a story and every cup sparks joy.</p>
        <a href="#" class="btn">Order Now</a>
        <a href="#" class="btn">Contact Us</a>
        <br><br><br><br><br><br>
    </div>
</body>
</html>
    
</body>
</html>
